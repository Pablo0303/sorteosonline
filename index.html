<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 300px;
            height: 150px;
        }
        input {
            margin-bottom: 10px;
        }
        #countdown {
            font-size: 2em;
            margin-top: 20px;
            display: none;
        }
        #ganadores {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Sorteo</h1>

    <label for="nombres">Nombres de los participantes (uno por línea):</label><br>
    <textarea id="nombres"></textarea><br>

    <label for="cantidadGanadores">Cantidad de ganadores:</label><br>
    <input type="number" id="cantidadGanadores" min="1" value="1"><br>

    <button onclick="empezarSorteo()">Iniciar sorteo</button>

    <div id="countdown"></div>

    <div id="ganadores"></div>

    <script>
        function empezarSorteo() {
            let nombres = document.getElementById('nombres').value.split('\n').filter(n => n.trim() !== '');
            let cantidadGanadores = parseInt(document.getElementById('cantidadGanadores').value);

            // Seleccionar ganadores de manera uniforme
            let ganadores = seleccionarGanadores(nombres, cantidadGanadores);

            // Mostrar la cuenta regresiva
            let countdown = 10;
            document.getElementById('countdown').innerText = countdown;
            document.getElementById('countdown').style.display = 'block'; // Mostrar el contador

            let interval = setInterval(function() {
                countdown--;
                document.getElementById('countdown').innerText = countdown;
                if (countdown === 0) {
                    clearInterval(interval);
                    document.getElementById('countdown').style.display = 'none'; // Ocultar el contador
                    mostrarGanadores(ganadores);
                }
            }, 1000);
        }

        function seleccionarGanadores(nombres, cantidadGanadores) {
            let ganadores = [];
            let indicesGanadores = new Set(); // Evitar duplicados usando un Set

            while (ganadores.length < cantidadGanadores && nombres.length > 0) {
                let randomIndex = Math.floor(Math.random() * nombres.length);
                let nombreGanador = nombres[randomIndex].trim();

                if (!indicesGanadores.has(nombreGanador)) {
                    indicesGanadores.add(nombreGanador);
                    ganadores.push(nombreGanador);
                }
            }
            return ganadores;
        }

        function mostrarGanadores(ganadores) {
            let ganadoresDiv = document.getElementById('ganadores');
            ganadoresDiv.innerHTML = "Ganadores:<br>" + ganadores.join('<br>');
        }
    </script>

</body>
</html>
